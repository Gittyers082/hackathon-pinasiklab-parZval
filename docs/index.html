<!DOCTYPE html>
<html lang="fil">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0E7A55">
  <title>KitaKlaro</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=DM+Sans:opsz,wght@9..40,400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/desktop.css">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="KitaKlaro">
  <link rel="stylesheet" href="./css/pwa.css">
  <script src="./js/pwa.js"></script>
</head>
<body>
  <script src="./js/nav.js"></script>
  <main class="dashboard-page">
    <header class="page-heading home-heading"><div><h1 data-label="home_heading"></h1></div></header>
    <div class="dashboard-grid">
      <section class="card kumita dashboard-hero">
        <div class="card-topline"><span class="section-kicker"><span data-label="today_kicker"></span></span></div>
        <h2 data-label="kumita_title"></h2>
        <p class="muted" data-label="today"></p>
        <p id="kumita" class="big-number">₱0.00</p>
        <p class="hero-note"><span data-label="hero_note"></span></p>
        <div class="split hero-split">
          <span class="figure-benta"><span data-label="benta"></span><b id="benta">₱0.00</b></span>
          <span class="figure-gastos"><span data-label="gastos"></span><b id="gastos">₱0.00</b></span>
        </div>
      </section>

      <section class="card quick-entry-card">
        <div class="card-topline"><span class="section-kicker" data-label="quick_kicker"></span><span class="soft-tag" data-label="quick_tag"></span></div>
        <h2 data-label="quick_title"></h2>
        <p class="muted" data-label="quick_desc"></p>
        <a class="btn quick-start" href="./benta.html"><span aria-hidden="true">🎙</span><span data-label="quick_action"></span><span aria-hidden="true">→</span></a>
        <a class="receipt-quicklink" href="./receipt.html"><span class="receipt-icon">▣</span><span><strong data-label="receipt_link"></strong><small data-label="receipt_desc"></small></span><span aria-hidden="true">→</span></a>
      </section>

      <section id="expiry-alert" class="card alert" role="status" hidden>
        <h2><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17v.5"/></svg><span data-label="expiry_title"></span></h2>
        <ul id="expiry-list" class="expiry-list"></ul><a href="./ubos.html" data-label="see_inventory"></a>
      </section>

      <section class="card stock-panel">
        <div class="card-topline"><span class="section-kicker"><span data-label="stock_kicker"></span></span><a href="./ubos.html" class="text-link"><span data-label="see_all"></span> →</a></div>
        <h2><span data-label="stock_title"></span></h2>
        <p class="muted"><span data-label="stock_desc"></span></p>
        <div id="stock-glance" class="stock-glance"><p class="muted"><span data-label="loading_inventory"></span></p></div>
      </section>
      <section class="card recent-panel">
        <div class="card-topline"><span class="section-kicker"><span data-label="recent_kicker"></span></span><span class="soft-tag"><span data-label="today"></span></span></div>
        <h2 data-label="recent_title"></h2>
        <p class="muted"><span data-label="recent_desc"></span></p>
        <div id="recent-entries" class="recent-entries"><p class="muted"><span data-label="loading_records"></span></p></div>
        <a href="./ulat.html" class="text-link"><span data-label="see_reports"></span> →</a>
      </section>
    </div>
    <p id="message" class="message" role="status"></p>
  </main>

  <script src="./js/labels.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/dashboard.js"></script>
  
</body>
</html>
