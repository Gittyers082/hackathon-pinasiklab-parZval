<!DOCTYPE html>
<html lang="fil">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0E7A55">
  <title>Benta at Gastos – KitaKlaro</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=DM+Sans:opsz,wght@9..40,400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/desktop.css">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="KitaKlaro">
  <link rel="stylesheet" href="./css/pwa.css">
  <script src="./js/pwa.js"></script>
</head>
<body>
  <script src="./js/nav.js"></script>
  <main class="benta-page">
    <header class="page-heading page-heading-simple"><div><h1 data-label="entry_heading"></h1></div></header>

    <section class="card quick-panel quick-panel-page" id="voice-entry">
      <div class="card-topline"><span class="section-kicker"><span data-label="quick_kicker"></span></span><span class="soft-tag"><span data-label="quick_tag"></span></span></div>
      <h2 data-label="entry_title"></h2>
      <p class="muted"><span data-label="entry_desc"></span></p>
      <button id="mic" class="btn mic" type="button" hidden>
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        <span data-label="mic"></span>
      </button>
      <p class="quick-example"><span data-label="entry_example"></span></p>
      <form id="type-form" class="type-form"><input id="type-box" type="text" autocomplete="off" data-label-ph="type_ph" aria-label="Type entry"><button class="btn" type="submit" data-label="add"></button></form>
      <a href="./receipt.html" class="receipt-quicklink"><span class="receipt-icon">▣</span><span><strong><span data-label="receipt_link"></span></strong><small><span data-label="receipt_desc"></span></small></span><span aria-hidden="true">→</span></a>

    </section>

    <p id="save-success" class="save-success" role="status" hidden></p>
    <p id="message" class="message" role="status"></p>
    <form id="confirm" class="card confirm" hidden>
      <div class="confirm-title"><span class="section-kicker" data-label="confirm_kicker"></span><h2 data-label="confirm_title"></h2></div>
      <div class="confirm-grid">
        <label><span data-label="f_kind"></span><select name="kind"><option value="" disabled>—</option><option value="utang" data-label="k_utang"></option><option value="bayad" data-label="k_bayad"></option><option value="benta" data-label="k_benta"></option><option value="gastos" data-label="k_gastos"></option></select></label>
        <label data-for="name"><span data-label="f_name"></span><input name="name" maxlength="60"></label>
        <label><span data-label="f_item"></span><input name="item" maxlength="60" list="product-names" autocomplete="off"></label>
        <datalist id="product-names"></datalist>
        <label data-for="qty"><span data-label="f_qty"></span><input name="qty" type="number" min="1" step="1" inputmode="numeric"></label>
        <p id="stock-preview" class="stock-preview" role="status" hidden></p>
        <label id="add-product-row" class="check" hidden><input type="checkbox" name="add_product"><span data-label="add_to_inv"></span></label>
        <label><span data-label="f_amount"></span><input name="amount" type="number" min="0.01" max="100000" step="0.01" inputmode="decimal" aria-describedby="amount-hint"></label>
        <p id="amount-hint" class="hint" hidden></p>
      </div>
      <div class="row"><button class="btn" type="submit" data-label="tama"></button><button class="btn secondary" type="button" id="ayusin" data-label="ayusin"></button></div>
    </form>


  </main>

  <script src="./js/labels.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/parser.js"></script>
  <script src="./js/voice.js"></script>
  <script src="./js/home.js"></script>
  
</body>
</html>
