<!DOCTYPE html>
<html lang="fil">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0E7A55">
  <title>Mga Tala – KitaKlaro</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=DM+Sans:opsz,wght@9..40,400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/desktop.css">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="KitaKlaro">
  <link rel="stylesheet" href="./css/pwa.css">
  <script src="./js/pwa.js"></script>
</head>
<body>
  <script src="./js/nav.js"></script>
  <main class="records-page">
    <header class="page-heading page-heading-simple"><div>
      <h1 data-label="records_heading"></h1>
      <p class="page-subtitle" data-label="records_intro"></p>
    </div></header>
    <p id="records-saved" class="save-success" role="status" hidden></p>
    <p id="records-status" class="message" role="status"></p>
    <div class="record-toolbar"><a href="./benta.html" class="btn record-new" data-label="new_record"></a><a href="./utang.html" class="text-link" data-label="balances_link"></a></div>
    <div class="record-tabs" role="tablist" aria-label="Transaction type">
      <button type="button" role="tab" data-tab="benta" aria-selected="true" data-label="k_benta"></button>
      <button type="button" role="tab" data-tab="utang" aria-selected="false" data-label="k_utang"></button>
      <button type="button" role="tab" data-tab="bayad" aria-selected="false" data-label="k_bayad"></button>
      <button type="button" role="tab" data-tab="gastos" aria-selected="false" data-label="k_gastos"></button>
    </div>
    <section class="card records-panel" role="tabpanel" aria-label="Transactions">
      <div class="card-topline"><h2 id="records-tab-title"></h2><span id="records-count" class="soft-tag"></span></div>
      <ul id="records-list" class="records-list"></ul>
      <p id="records-empty" class="empty-note" hidden></p>
    </section>
  </main>
  <script src="./js/labels.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/records.js"></script>
  
</body>
</html>
