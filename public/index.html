<!DOCTYPE html>
<html lang="fil">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1f7a4d">
  <title>KitaKlaro</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <header class="top">
    <h1>KitaKlaro</h1>
    <span id="demo-badge" class="badge" data-label="demo" hidden></span>
    <select id="lang" aria-label="Wika / Language">
      <option value="tl">Tagalog</option>
      <option value="ilo">Ilocano</option>
      <option value="en">English</option>
    </select>
  </header>

  <main>
    <section class="card kumita">
      <h2 data-label="kumita_title"></h2>
      <p class="muted" data-label="today"></p>
      <p id="kumita" class="big-number">₱0.00</p>
      <p class="split">
        <span><span data-label="benta"></span>: <b id="benta">₱0.00</b></span>
        <span><span data-label="gastos"></span>: <b id="gastos">₱0.00</b></span>
      </p>
    </section>

    <button id="mic" class="btn mic" type="button" data-label="mic" hidden></button>

    <form id="type-form" class="type-form">
      <input id="type-box" type="text" autocomplete="off" data-label-ph="type_ph" aria-label="Type entry">
      <button class="btn" type="submit" data-label="add"></button>
    </form>

    <p id="message" class="message" role="status"></p>

    <form id="confirm" class="card confirm" hidden>
      <h2 data-label="confirm_title"></h2>
      <label><span data-label="f_kind"></span>
        <select name="kind">
          <option value="" disabled>—</option>
          <option value="utang" data-label="k_utang"></option>
          <option value="bayad" data-label="k_bayad"></option>
          <option value="benta" data-label="k_benta"></option>
          <option value="gastos" data-label="k_gastos"></option>
        </select>
      </label>
      <label data-for="name"><span data-label="f_name"></span><input name="name" maxlength="60"></label>
      <label><span data-label="f_item"></span><input name="item" maxlength="60"></label>
      <label data-for="qty"><span data-label="f_qty"></span><input name="qty" type="number" min="1" step="1" inputmode="numeric"></label>
      <label><span data-label="f_amount"></span><input name="amount" type="number" min="0.01" max="100000" step="0.01" inputmode="decimal"></label>
      <div class="row">
        <button class="btn" type="submit" data-label="tama"></button>
        <button class="btn secondary" type="button" id="ayusin" data-label="ayusin"></button>
      </div>
    </form>
  </main>

  <nav class="bottom-nav">
    <a href="./index.html" aria-current="page">🏠<span data-label="nav_home"></span></a>
    <a href="./utang.html">📒<span data-label="nav_utang"></span></a>
    <a href="./ubos.html">📦<span data-label="nav_ubos"></span></a>
  </nav>

  <script src="./js/labels.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/parser.js"></script>
  <script src="./js/voice.js"></script>
  <script src="./js/home.js"></script>
  <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');</script>
</body>
</html>
